[project]
name = "prism"
version = "0.1.0"
description = "sapper-skill 确定性控制面（内部实现代号 prism）"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # v1→v2 全量记录/Result/配置校验，JSON Schema 自动导出
    "pydantic>=2.7,<3.0",
    # 一致 CLI、紧凑黑板、人类可读与机器 JSON 双输出
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    # engagement / scope / 输入清单解析
    "PyYAML>=6.0,<7.0",
    # Windows/POSIX 跨平台入库锁（Lease 的语义恢复配套）
    "filelock>=3.13,<4.0",
    # 中英文混合检索、指纹模糊匹配（P3 混合召回）
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.44",
    "rapidfuzz>=3.6,<4.0",
    # 类型化关系图、攻击路径与影响面分析（派生投影）
    "networkx>=3.2,<4.0",
    # 离线报告与面板渲染（静态资源内联，无 CDN）
    "jinja2>=3.1,<4.0",
    "pyvis>=0.3.2,<0.4",
    # KB 元数据（来源、适用版本、信任级别）
    "python-frontmatter>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
]
